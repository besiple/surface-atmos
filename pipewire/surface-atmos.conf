# PipeWire Smart Filter for Microsoft Surface Laptop Studio
# Adaptive Stage & Studio Acoustic Compensation
# Targets alsa_output.pci-0000_00_1f.3.analog-stereo inline without virtual sink duplication

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Surface Stage Acoustic Compensator"
            media.name       = "Surface Stage Acoustic Compensator"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_fl
                        label = bq_highshelf
                        control = { "Freq" = 3000.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_fr
                        label = bq_highshelf
                        control = { "Freq" = 3000.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                ]
                inputs  = [ "eq_fl:In" "eq_fr:In" ]
                outputs = [ "eq_fl:Out" "eq_fr:Out" ]
            }
            capture.props = {
                node.name = "surface_stage_compensator"
                media.class = "Audio/Sink"
                filter.smart = true
                filter.smart.name = "surface_stage_filter"
                filter.smart.target = {
                    node.name = "alsa_output.pci-0000_00_1f.3.analog-stereo"
                }
            }
            playback.props = {
                node.name = "surface_stage_playback"
                node.passive = true
                node.dont-fallback = true
                node.linger = true
            }
        }
    }
]
